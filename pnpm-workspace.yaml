packages:
  - apps/*
  - fixtures/*/*
  - packages/*

# Build scripts of @sanity/ailf's transitive deps are gated off because AILF runs
# remote (--remote); flip a value to true if you need one built locally.
allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  msw: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

catalog:
  '@next/env': 16.5.0-canary.54
  '@sanity/client': ^7.28.0
  '@sanity/image-url': ^2.2.0
  '@sanity/themer': ^0.10.7
  '@sanity/tsconfig': ^2.2.1
  '@sanity/vision': 6.24.0
  '@types/node': ^24.19.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vercel/related-projects': ^1.1.1
  groqd: ^1.7.1
  next: 16.5.0-canary.54
  react: ^19.3.1
  react-dom: ^19.3.1
  sanity: 6.24.0
  styled-components: ^6.6.0
  typescript: 7.0.2

dedupePeers: true
dedupeDirectDeps: true
linkWorkspacePackages: deep

overrides:
  '@next/env': 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  next: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  # scripts/installE2EStudio.mjs temporarily replaces this to install a selected E2E Studio build.
  sanity: next
  '@sanity/vision': next

peerDependencyRules:
  allowAny:
    - react
    - react-dom

preferWorkspacePackages: true

# Mirrors the `min-age-exceptions` preset in sanity-io/renovate-config: these are
# updated without a minimum release age (and Next.js is tracked on `canary`), so
# pnpm's default 1 day `minimumReleaseAge` would otherwise reject the lockfile.
minimumReleaseAgeExclude:
  - '@portabletext/*'
  - '@sanity/*'
  - create-sanity
  - get-it
  - groq
  - groq-js
  - mendoza
  - next-sanity
  - react-rx
  - sanity
  - use-effect-event
  - '@next/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - '@types/*'
  - next
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - pnpm
  - react
  - react-dom
  - react-is
