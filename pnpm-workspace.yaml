packages:
  - apps/*
  - fixtures/*/*
  - packages/*

# Build scripts of @sanity/ailf's transitive deps are gated off because AILF runs
# remote (--remote); flip a value to true if you need one built locally.
allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false

catalog:
  '@next/env': 16.3.1-canary.15
  '@sanity/client': ^7.26.2
  '@sanity/image-url': ^2.1.1
  '@sanity/themer': ^0.3.9
  '@sanity/tsconfig': ^2.2.1
  '@sanity/vision': 6.9.2
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  groqd: ^1.7.1
  next: 16.3.1-canary.15
  react: ^19.2.8
  react-dom: ^19.2.8
  sanity: 6.9.2
  styled-components: ^6.5.3
  typescript: 7.0.2

dedupePeers: true
dedupeDirectDeps: true
linkWorkspacePackages: deep

overrides:
  '@next/env': 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  next: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  # sanity: 'catalog:'
  sanity: next
  '@sanity/vision': next

peerDependencyRules:
  allowAny:
    - react
    - react-dom

preferWorkspacePackages: true
